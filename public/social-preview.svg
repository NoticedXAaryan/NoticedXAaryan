<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Aaryan Kumar Tiwari Portfolio</title>
  <desc id="desc">Social preview card for aaaryan.space</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="90"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="170" cy="90" r="220" fill="#34d399" opacity="0.2" filter="url(#blur)" />
  <circle cx="1060" cy="560" r="260" fill="#3b82f6" opacity="0.2" filter="url(#blur)" />

  <text x="90" y="220" fill="#e5e7eb" font-size="34" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" letter-spacing="2">AAARYAN.SPACE</text>
  <text x="90" y="320" fill="#ffffff" font-size="76" font-weight="700" font-family="Space Grotesk, Segoe UI, Arial, sans-serif">Aaryan Kumar Tiwari</text>
  <text x="90" y="390" fill="url(#accent)" font-size="42" font-family="Space Grotesk, Segoe UI, Arial, sans-serif">Full-Stack Developer • AI/ML • Systems</text>
  <text x="90" y="470" fill="#9ca3af" font-size="30" font-family="Space Grotesk, Segoe UI, Arial, sans-serif">React • TypeScript • Rust • Python</text>

  <rect x="90" y="515" width="270" height="64" rx="14" fill="url(#accent)" opacity="0.95"/>
  <text x="225" y="557" text-anchor="middle" fill="#051018" font-size="28" font-weight="700" font-family="Space Grotesk, Segoe UI, Arial, sans-serif">Visit Portfolio</text>
</svg>
